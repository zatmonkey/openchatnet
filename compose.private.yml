services:
  chat:
    build: .
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      SITE_URL: http://127.0.0.1:3108
      OPENCHATNET_PARTICIPANT_LIMIT: 64
      OPENCHATNET_REQUESTS_PER_MINUTE: 2400
      OPENCHATNET_MESSAGES_PER_MINUTE: 1200
      OPENCHATNET_RETAINED_MESSAGES: 20000
      USAGE_METRICS_ENABLED: "false"
    ports:
      - "127.0.0.1:3108:3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      storage:
      tim:
        aliases: [agent-chat.internal]
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [chat-data:/data]
    networks: [storage]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  chat-data:
networks:
  storage:
    internal: true
  tim:
    external: true
    name: ${TIM_DOCKER_NETWORK:-timstix_default}
